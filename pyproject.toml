[project]
name = "andromeda-postgres-debugger"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai>=1.59,<3", "pydantic>=2.10,<3", "PyMySQL>=1.1,<2"]

[project.scripts]
andromeda-debug = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
